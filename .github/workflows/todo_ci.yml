name: TODO Management

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  scan-todos:
    name: Scan for TODO Comments
    runs-on: ubuntu-latest

    steps:
      - name: Debug Branch Information
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Current ref: ${{ github.ref }}"
          echo "Default branch: ${{ github.event.repository.default_branch }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR base ref: ${{ github.event.pull_request.base.ref }}"
            echo "PR merged: ${{ github.event.pull_request.merged }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git blame
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Get Default Branch
        id: default-branch
        run: |
          DEFAULT_BRANCH=$(gh api repos/${{ github.repository }} --jq '.default_branch')
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "Default branch detected: $DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - name: Check if on Default Branch
        id: branch-check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CURRENT_BRANCH="${{ github.ref_name }}"
            echo "Push to branch: $CURRENT_BRANCH"
            if [[ "$CURRENT_BRANCH" == "${{ steps.default-branch.outputs.default_branch }}" ]]; then
              echo "on_default=true" >> $GITHUB_OUTPUT
              echo "✅ Push is on default branch"
            else
              echo "on_default=false" >> $GITHUB_OUTPUT
              echo "❌ Push is not on default branch"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            PR_BASE="${{ github.event.pull_request.base.ref }}"
            echo "PR merged to: $PR_BASE"
            if [[ "$PR_BASE" == "${{ steps.default-branch.outputs.default_branch }}" ]]; then
              echo "on_default=true" >> $GITHUB_OUTPUT
              echo "✅ PR merged to default branch"
            else
              echo "on_default=false" >> $GITHUB_OUTPUT
              echo "❌ PR not merged to default branch"
            fi
          else
            echo "on_default=false" >> $GITHUB_OUTPUT
            echo "❌ Event does not match criteria"
          fi

      - name: Set up Python
        if: steps.branch-check.outputs.on_default == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: steps.branch-check.outputs.on_default == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub gitpython

      - name: Scan for TODOs and Create/Update Issue
        if: steps.branch-check.outputs.on_default == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os
          import re
          import subprocess
          from pathlib import Path
          from github import Github
          from datetime import datetime
          import json

          def get_git_blame_info(file_path, line_number):
              """Get commit hash and author info for a specific line"""
              try:
                  # Use git blame to get commit info
                  result = subprocess.run([
                      'git', 'blame', '-L', f'{line_number},{line_number}', '--porcelain', file_path
                  ], capture_output=True, text=True, cwd='.')

                  if result.returncode == 0:
                      lines = result.stdout.strip().split('\n')
                      if lines:
                          # First line contains commit hash
                          commit_hash = lines[0].split()[0]
                          # Return both full hash and short hash (first 7 characters)
                          return {
                              'full_hash': commit_hash,
                              'short_hash': commit_hash[:7]
                          }

                  return {'full_hash': 'unknown', 'short_hash': 'unknown'}
              except Exception as e:
                  print(f"Error getting git blame for {file_path}:{line_number}: {e}")
                  return {'full_hash': 'unknown', 'short_hash': 'unknown'}

          def load_gitignore_patterns():
              """Load patterns from .gitignore file"""
              gitignore_patterns = []
              # Working directory should be repo root after checkout, but let's be explicit
              repo_root = Path('.')
              gitignore_path = repo_root / '.gitignore'

              print(f"Looking for .gitignore at: {gitignore_path.absolute()}")

              if gitignore_path.exists():
                  try:
                      with open(gitignore_path, 'r', encoding='utf-8') as f:
                          for line in f:
                              line = line.strip()
                              # Skip empty lines and comments
                              if line and not line.startswith('#'):
                                  gitignore_patterns.append(line)
                  except Exception as e:
                      print(f"Error reading .gitignore: {e}")

              # Always exclude some critical directories/files for safety
              critical_excludes = ['.git', '.git/', '.git/**']
              gitignore_patterns.extend(critical_excludes)

              return gitignore_patterns

          def should_skip_file(file_path, gitignore_patterns):
              """Check if file should be skipped based on gitignore patterns"""
              import fnmatch

              # Convert to string for pattern matching
              file_str = str(file_path)
              relative_path = str(file_path.relative_to('.'))

              for pattern in gitignore_patterns:
                  # Handle directory patterns (ending with /)
                  if pattern.endswith('/'):
                      dir_pattern = pattern.rstrip('/')
                      # Check if any part of the path matches the directory pattern
                      for part in file_path.parts:
                          if fnmatch.fnmatch(part, dir_pattern):
                              return True
                      # Also check full path for directory patterns
                      if fnmatch.fnmatch(relative_path + '/', pattern):
                          return True
                  else:
                      # Handle file patterns
                      # Check full relative path
                      if fnmatch.fnmatch(relative_path, pattern):
                          return True
                      # Check filename only
                      if fnmatch.fnmatch(file_path.name, pattern):
                          return True
                      # Handle patterns with **/ (recursive directory matching)
                      if '**/' in pattern:
                          # Convert **/ pattern to work with fnmatch
                          simple_pattern = pattern.replace('**/', '')
                          if fnmatch.fnmatch(file_path.name, simple_pattern):
                              return True
                          # Also check if pattern matches any part of the path
                          for part in file_path.parts:
                              if fnmatch.fnmatch(part, simple_pattern):
                                  return True

              return False

          def scan_file_for_todos(file_path, gitignore_patterns):
              """Scan a file for TODO comments and return list of TODOs with metadata"""
              todos = []

              # Check if file should be skipped based on gitignore patterns
              if should_skip_file(file_path, gitignore_patterns):
                  return todos

              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()

                  for line_num, line in enumerate(lines, 1):
                      # Look for TODO: pattern at the start of a comment (case insensitive)
                      # Match various comment styles: //, #, %, !, ;, --, ', ", etc.
                      todo_match = re.search(r'^\s*([\/]{2}|[#%!;]|--|\*|\'|\"|REM\s)\s*TODO:\s*(.*)', line, re.IGNORECASE)
                      if todo_match:
                          todo_text = todo_match.group(2).strip()
                          if todo_text:  # Only include non-empty TODOs
                              commit_info = get_git_blame_info(str(file_path), line_num)
                              todos.append({
                                  'line': line_num,
                                  'text': todo_text,
                                  'commit_hash': commit_info['short_hash'],
                                  'commit_hash_full': commit_info['full_hash'],
                                  'full_line': line.strip()
                              })

              except Exception as e:
                  print(f"Error reading file {file_path}: {e}")

              return todos

          def scan_repository():
              """Scan entire repository for TODO comments"""
              repo_todos = {}
              repo_path = Path('.')

              # Debug: Show current working directory
              print(f"Current working directory: {repo_path.absolute()}")
              print(f"Directory contents: {list(repo_path.iterdir())[:10]}")  # Show first 10 items

              # Load gitignore patterns once
              print("Loading .gitignore patterns...")
              gitignore_patterns = load_gitignore_patterns()
              print(f"Loaded {len(gitignore_patterns)} gitignore patterns")

              # Get all files in repository
              for file_path in repo_path.rglob('*'):
                  if file_path.is_file():
                      todos = scan_file_for_todos(file_path, gitignore_patterns)
                      if todos:
                          # Use relative path from repo root
                          relative_path = str(file_path.relative_to(repo_path))
                          repo_todos[relative_path] = todos

              return repo_todos

          def create_issue_body(todos_dict, repository_name, default_branch):
              """Create formatted issue body from TODOs dictionary"""
              if not todos_dict:
                  return "No TODO comments found in the repository."

              body = f"""# TODO Items Found in Repository

          This issue is automatically generated and contains all TODO comments found in the codebase.

          **Last updated:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}
          **Total files with TODOs:** {len(todos_dict)}
          **Total TODO items:** {sum(len(todos) for todos in todos_dict.values())}

          ---

          """

              # Sort files alphabetically
              for file_path in sorted(todos_dict.keys()):
                  todos = todos_dict[file_path]
                  # Create GitHub permalink to the file
                  file_url = f"https://github.com/{repository_name}/blob/{default_branch}/{file_path}"
                  body += f"## 📁 [`{file_path}`]({file_url})\n\n"

                  # Sort TODOs by line number
                  todos.sort(key=lambda x: x['line'])

                  for todo in todos:
                      # Create direct link to the specific line
                      line_url = f"https://github.com/{repository_name}/blob/{default_branch}/{file_path}#L{todo['line']}"
                      # Create link to commit (use full hash for URL but display short hash)
                      commit_url = f"https://github.com/{repository_name}/commit/{todo['commit_hash_full']}" if todo['commit_hash_full'] != 'unknown' else '#'
                      commit_display = f"[`{todo['commit_hash']}`]({commit_url})" if todo['commit_hash'] != 'unknown' else '`unknown`'
                      body += f"- **[Line {todo['line']}]({line_url})** (commit {commit_display}): {todo['text']}\n"
                      body += f"  ```\n  {todo['full_line']}\n  ```\n\n"

                  body += "---\n\n"

              body += """
          ## ℹ️ Information

          - This issue is automatically updated when TODO comments are added, modified, or removed
          - Each TODO item shows the line number and the commit hash where it was introduced
          - **Click on line numbers** to jump directly to the TODO in the source code
          - **Click on commit hashes** to view the commit that introduced the TODO
          - To resolve a TODO item, either complete the task and remove the comment, or update it with progress

          **Note:** This issue will be automatically updated on every push to the main branch.
          """

              return body

          def main():
              # Initialize GitHub client
              github_token = os.environ['GITHUB_TOKEN']
              repository_name = os.environ['REPOSITORY']

              g = Github(github_token)
              repo = g.get_repo(repository_name)

              # Get default branch name for link generation
              default_branch = repo.default_branch

              print("Scanning repository for TODO comments...")
              todos_dict = scan_repository()

              print(f"Found TODOs in {len(todos_dict)} files")
              for file_path, todos in todos_dict.items():
                  print(f"  {file_path}: {len(todos)} TODOs")

              # Look for existing TODO issue
              issue_title = "🔄 TODO Items Tracker"
              existing_issue = None

              # Search for existing issue
              issues = repo.get_issues(state='open', labels=[])
              for issue in issues:
                  if issue.title == issue_title:
                      existing_issue = issue
                      break

              # Create issue body with repository info and default branch
              issue_body = create_issue_body(todos_dict, repository_name, default_branch)

              if todos_dict:
                  if existing_issue:
                      # Update existing issue
                      print(f"Updating existing issue #{existing_issue.number}")
                      existing_issue.edit(body=issue_body)
                      # Add a comment about the update
                      existing_issue.create_comment(f"🔄 TODO list updated automatically on {datetime.now().strftime('%Y-%m-%d at %H:%M:%S UTC')}")
                  else:
                      # Create new issue
                      print("Creating new TODO tracking issue")
                      new_issue = repo.create_issue(
                          title=issue_title,
                          body=issue_body,
                          labels=['documentation', 'enhancement', 'automated']
                      )
                      print(f"Created issue #{new_issue.number}")
              else:
                  if existing_issue:
                      # Close existing issue if no TODOs found
                      print(f"No TODOs found, closing issue #{existing_issue.number}")
                      existing_issue.edit(
                          body="✅ **All TODO items have been resolved!**\n\nNo TODO comments were found in the repository. This issue will be reopened automatically if new TODO items are added.",
                          state='closed'
                      )
                      existing_issue.create_comment("🎉 All TODO items have been completed! Closing this issue automatically.")
                  else:
                      print("No TODOs found and no existing issue to update")

          if __name__ == "__main__":
              main()
          EOF